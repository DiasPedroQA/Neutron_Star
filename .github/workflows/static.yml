name: "Docs → GitHub Pages"

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # A documentação só é publicada a partir do push em main (workflow_dispatch
  # também disponível para rodar manualmente).
  #
  # NOTA: pyproject.toml e src/ vivem em Atoms/, mas docs/ vive na raiz do
  # repositório. Por isso as dependências são instaladas com
  # working-directory: Atoms, e o build do Sphinx roda a partir da raiz.

  build-docs:
    name: "Build Sphinx Docs"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Atoms/pyproject.toml

      - name: Instalar dependências (inclui furo e sphinx)
        working-directory: Atoms
        run: python -m pip install -e .[dev]

      - name: Gerar documentação Sphinx
        run: python -m sphinx -b html docs docs/_build/html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Fazer upload do artefato de páginas
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: "Deploy to GitHub Pages"
    needs: build-docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
