name: "Docs → GitHub Pages"

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    name: "Build Sphinx Docs"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Atoms/pyproject.toml

      - name: Instalar pip-tools
        working-directory: Atoms
        run: python -m pip install pip-tools  # sonar-ignore

      - name: Compilar requirements com versões fixas
        working-directory: Atoms
        run: |
          pip-compile pyproject.toml --extra=dev --extra=api --output-file=requirements.lock
          # Opcional: gerar com hashes (mais seguro)
          # pip-compile pyproject.toml --extra=dev --extra=api --generate-hashes --output-file=requirements.lock

      - name: Instalar dependências a partir do lock
        working-directory: Atoms
        run: |
          python -m pip install --upgrade pip  # sonar-ignore
          python -m pip install -r requirements.lock  # sonar-ignore
          # Instala o próprio projeto em modo editável (opcional)
          python -m pip install -e .  # sonar-ignore

      - name: Gerar documentação Sphinx
        run: python -m sphinx -b html docs docs/_build/html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Fazer upload do artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

      - name: Salvar lock como artefato (opcional)
        uses: actions/upload-artifact@v4
        with:
          name: requirements-lock
          path: Atoms/requirements.lock
          retention-days: 1

  deploy:
    name: "Deploy to GitHub Pages"
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
