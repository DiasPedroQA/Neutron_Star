name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Lint & Formatação (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Atoms/requirements.lock
      - name: Instalar dependências travadas (hash-locked)
        working-directory: Atoms
        run: python -m pip install -r requirements.lock --require-hashes
      - name: Instalar o pacote local (sem resolver dependências)
        working-directory: Atoms
        run: python -m pip install --no-deps -e .  # NOSONAR: pip nao permite --require-hashes combinado com -e (instalacao do pacote local, nao e dependencia externa)
      - name: Ruff check
        working-directory: Atoms
        run: python -m ruff check src tests
      - name: Ruff format check
        working-directory: Atoms
        run: python -m ruff format --check src tests

  security:
    name: Auditoria de Segurança
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Atoms/requirements.lock
      - name: Instalar dependências travadas (hash-locked)
        working-directory: Atoms
        run: python -m pip install -r requirements.lock --require-hashes
      - name: Instalar o pacote local (sem resolver dependências)
        working-directory: Atoms
        run: python -m pip install --no-deps -e .  # NOSONAR: pip nao permite --require-hashes combinado com -e (instalacao do pacote local, nao e dependencia externa)
      - name: Bandit
        working-directory: Atoms
        run: python -m bandit -c pyproject.toml -r src
      - name: pip-audit
        working-directory: Atoms
        run: python -m pip_audit

  test:
    name: Testes (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: Atoms/requirements.lock
      - name: Instalar dependências travadas (hash-locked)
        working-directory: Atoms
        run: python -m pip install -r requirements.lock
      - name: Instalar o pacote local (sem resolver dependências)
        working-directory: Atoms
        run: python -m pip install --no-deps -e .  # NOSONAR: pip nao permite --require-hashes combinado com -e (instalacao do pacote local, nao e dependencia externa)
      - name: Executar testes com cobertura
        working-directory: Atoms
        run: python -m pytest --cov=src --cov-report=term-missing --cov-report=xml
      - name: Upload da cobertura (apenas Ubuntu + Python 3.12)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: Atoms/coverage.xml

  build-check:
    name: Verificação de Build (wheel + sdist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Atoms/requirements.lock
      - name: Instalar dependências travadas (hash-locked)
        working-directory: Atoms
        run: python -m pip install -r requirements.lock --require-hashes
      - name: Construir distribuições
        working-directory: Atoms
        run: python -m build
      - name: Conferir artefatos gerados
        working-directory: Atoms
        run: |
          ls -la dist/
          test -f dist/*.whl || (echo "❌ Wheel não encontrado" && exit 1)
          test -f dist/*.tar.gz || (echo "❌ Source tarball não encontrada" && exit 1)
          echo "✅ Build bem-sucedido"

  lock-check:
    name: Verificar se requirements.lock está atualizado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Atoms/requirements.lock
      - name: Instalar pip-tools (versão travada, sem dependências soltas)
        working-directory: Atoms
        run: python -m pip install "pip-tools==7.4.1"
      - name: Regenerar lock temporário e comparar
        working-directory: Atoms
        run: |
          cp requirements.lock requirements.lock.bak
          python -m piptools compile --generate-hashes --strip-extras pyproject.toml \
            --extra dev --extra api --extra parquet --extra table \
            --extra security --extra docs --extra build \
            --output-file requirements.lock
          if diff requirements.lock.bak requirements.lock > /dev/null; then
            echo "✅ requirements.lock está atualizado."
          else
            echo "❌ requirements.lock está desatualizado. Execute 'make lock' localmente."
            diff requirements.lock.bak requirements.lock
            exit 1
          fi

  docs:
    name: Documentação (Build Sphinx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Atoms/requirements.lock
      - name: Instalar dependências travadas (hash-locked)
        working-directory: Atoms
        run: python -m pip install -r requirements.lock --require-hashes
      - name: Instalar o pacote local (sem resolver dependências)
        working-directory: Atoms
        run: python -m pip install --no-deps -e .  # NOSONAR: pip nao permite --require-hashes combinado com -e (instalacao do pacote local, nao e dependencia externa)
      - name: Build Sphinx (warnings tratados como erros)
        working-directory: Atoms
        run: python -m sphinx -b html docs docs/_build/html -W

  sonar:
    name: SonarCloud Analysis
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Baixar cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: Atoms
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
