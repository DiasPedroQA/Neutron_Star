name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Lint e formatação (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Atoms/requirements-ci.lock
      - name: Instalar ferramentas fixadas
        run: python -m pip install --require-hashes -r Atoms/requirements-ci.lock
      - name: Executar Ruff
        working-directory: Atoms
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests

  test:
    name: Testes (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: Atoms/requirements-ci.lock
      - name: Instalar dependências fixadas
        run: python -m pip install --require-hashes -r Atoms/requirements-ci.lock
      - name: Construir wheel sem isolamento
        working-directory: Atoms
        run: python -m build --wheel --no-isolation --outdir dist
      - name: Instalar wheel construído
        working-directory: Atoms
        run: >-
          python -c "from pathlib import Path; import subprocess, sys; wheels =
          sorted(Path('dist').glob('*.whl')); assert len(wheels) == 1,
          f'Esperado um wheel, encontrado: {wheels}';
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
          '--no-deps', '--force-reinstall', str(wheels[0])])"
      - name: Executar testes
        working-directory: Atoms
        run: python -m pytest --cov=src --cov-report=term-missing --cov-report=xml
      - name: Enviar cobertura de referência
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-3.12
          path: Atoms/coverage.xml
          if-no-files-found: error

  security:
    name: Auditoria de segurança
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Atoms/requirements-ci.lock
      - name: Instalar ferramentas fixadas
        run: python -m pip install --require-hashes -r Atoms/requirements-ci.lock
      - name: Executar Bandit
        working-directory: Atoms
        run: python -m bandit -c pyproject.toml -r src
      - name: Auditar dependências
        run: python -m pip_audit --requirement Atoms/requirements-ci.lock

  sonar:
    name: Análise SonarCloud
    needs: test
    if: github.repository_owner == 'DiasPedroQA' && env.SONAR_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Atoms/requirements-ci.lock
      - name: Instalar dependências fixadas
        run: python -m pip install --require-hashes -r Atoms/requirements-ci.lock
      - name: Baixar cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage-python-3.12
          path: Atoms
      - name: Executar análise SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
