name: "CI/CD Pipeline"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: "🧹 Lint & Format (ubuntu · py3.12)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Atoms
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
      - name: "🔍 Lint com ruff"
        run: python -m ruff check src tests
      - name: "🧾 Verificar formatação com ruff"
        run: python -m ruff format --check src tests

  test:
    name: "🧪 Testes (${{ matrix.os }} · py${{ matrix.python-version }})"
    needs: lint
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Atoms
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
      - name: "🧱 Instalar build"
        run: python -m pip install build
      - name: "🏗️ Construir wheel"
        run: python -m build --wheel --outdir dist
      - name: "📦 Instalar wheel (sem dependências)"
        run: >
          python -c "from pathlib import Path; import subprocess, sys;
          wheels = sorted(Path('dist').glob('*.whl'));
          assert wheels, 'Nenhum wheel foi gerado em dist/';
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', str(wheels[0])])"
      - name: "✅ Rodar testes com cobertura"
        run: python -m pytest --cov=src --cov-report=xml --cov-report=term-missing
      - name: "📤 Upload relatório de cobertura"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml

  security:
    name: "🛡️ Auditoria de Segurança"
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Atoms
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
      - name: "🔧 Instalar ferramentas de segurança"
        run: |
          python -m pip install "pbr>=5.11.1,<6" "pip-audit>=2.6.1,<3" "bandit>=1.7.5,<2"
      - name: "🚨 Bandit (análise estática)"
        run: python -m bandit -c pyproject.toml -r src
      - name: "🔐 pip-audit (vulnerabilidades)"
        run: python -m pip_audit

  sonar:
    name: "📡 SonarQube Analysis"
    needs: test
    runs-on: ubuntu-latest
    if: github.repository_owner == 'DiasPedroQA'
    defaults:
      run:
        working-directory: Atoms
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
      - name: "⬇️ Baixar relatório de cobertura (Ubuntu/py3.12)"
        uses: actions/download-artifact@v4
        with:
          name: coverage-ubuntu-latest-py3.12
          path: .
      - name: "📊 SonarCloud Scan"
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  release:
    name: "🚀 Release"
    needs: [security, sonar]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "🧱 Instalar build"
        run: python -m pip install build
      - name: "⚙️ Construir wheel e sdist"
        run: python -m build --outdir dist
        working-directory: Atoms
      - name: "📦 Publicar artefatos de release"
        uses: softprops/action-gh-release@v2
        with:
          files: Atoms/dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
