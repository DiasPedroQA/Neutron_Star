name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: "Lint & Format (ubuntu · py3.12)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Atoms
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Atoms/pyproject.toml
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Lint com ruff
        run: python -m ruff check src tests
      - name: Verificar formatação com ruff
        run: python -m ruff format --check src tests

  test:
    name: "Testes (${{ matrix.os }} · py${{ matrix.python-version }})"
    needs: lint
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Atoms
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: Atoms/pyproject.toml
      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Rodar testes com cobertura
        run: python -m pytest --cov=src --cov-report=xml --cov-report=term-missing
      - name: Upload relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: Atoms/coverage.xml

  security:
    name: "Auditoria de Segurança"
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Atoms
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Atoms/pyproject.toml
      - name: Instalar dependências e ferramentas
        run: |
          pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install pip-audit bandit
      - name: Bandit (análise estática)
        run: python -m bandit -c pyproject.toml -r src
      - name: pip-audit (vulnerabilidades)
        # Escaneia o ambiente atual sem precisar gerar requirements.txt
        run: python -m pip_audit

  sonar:
    name: "SonarQube Analysis"
    needs: test
    runs-on: ubuntu-latest
    if: github.repository_owner == 'DiasPedroQA'
    defaults:
      run:
        working-directory: Atoms
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Atoms/pyproject.toml

      # ⬇️ REMOVIDO: o pytest rodando aqui (já rodou no job 'test')
      # ⬇️ Agora só baixamos o artefato de cobertura com segurança

      - name: Baixar relatório de cobertura (Ubuntu/py3.12)
        uses: actions/download-artifact@v4
        with:
          name: coverage-ubuntu-latest-py3.12
          path: Atoms

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  release:
    name: "Release"
    needs: [security, sonar]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Atoms
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Atoms/pyproject.toml
      - name: Instalar build tools
        run: python -m pip install build
      - name: Construir wheel e sdist
        run: python -m build
      - name: Publicar artefatos de release
        uses: softprops/action-gh-release@v2
        with:
          files: Atoms/dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
