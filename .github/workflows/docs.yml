name: "Docs → GitHub Pages"

on:
  push:
    branches: ["main"]
    # ⬇️ Só roda se houver mudanças relevantes (evita execuções à toa)
    paths:
      - 'docs/**'
      - 'Atoms/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    name: "Build Sphinx Docs"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Atoms/pyproject.toml

      - name: Instalar dependências (Sphinx e furo)
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install sphinx furo
          # Caso queira gerar autodoc a partir do código, descomente a linha abaixo:
          # python -m pip install -e .

      - name: Gerar documentação Sphinx
        working-directory: .
        run: python -m sphinx -b html docs docs/_build/html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Fazer upload do artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: Atoms/docs/_build/html

  deploy:
    name: "Deploy to GitHub Pages"
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
