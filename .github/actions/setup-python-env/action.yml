# .github/actions/setup-python-env/action.yml

name: 'Setup Python Environment'
description: 'Configura o ambiente Python com cache e dependências'

inputs:
  python-version:
    description: 'Versão do Python'
    required: false
    default: '3.12'
  working-directory:
    description: 'Diretório de trabalho (onde está o requirements.txt ou pyproject.toml)'
    required: false
    default: './Atoms'

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          ${{ inputs.working-directory }}/requirements.lock
          ${{ inputs.working-directory }}/requirements.txt
          ${{ inputs.working-directory }}/pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install --only-binary :all: --upgrade pip
        pip install --only-binary :all: -r requirements.lock
      shell: bash
      working-directory: ${{ inputs.working-directory }}
