# .github/actions/setup-python-env/action.yml

name: 'Setup Python Environment'
description: 'Configura o ambiente Python com cache e instala as dependências do projeto'

inputs:
  python-version:
    description: 'Versão do Python'
    required: false
    default: '3.12'
  working-directory:
    description: 'Diretório de trabalho (onde está o pyproject.toml)'
    required: false
    default: './Atoms'

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          ${{ inputs.working-directory }}/pyproject.toml

    - name: Install dependencies
      # NOTA (Sonar S8544 / S8541): idealmente essas dependências viriam de um
      # arquivo travado por hash (pip install --require-hashes). Uma tentativa
      # anterior de gerar esse lock com pip-tools foi abandonada por conflito
      # de versão entre pip-tools e o pip do venv — ver histórico do projeto.
      # "--only-binary :all:" também não é aplicável aqui: "-e ." precisa
      # compilar o próprio pacote local a partir do código-fonte, então essa
      # flag quebraria a instalação editável. Risco aceito e documentado, não
      # ignorado silenciosamente — revisitar se/quando o lock for retomado.
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
      shell: bash
      working-directory: ${{ inputs.working-directory }}
