name: Setup Python environment
description: Configura Python, cache e instala dependências do lock
inputs:
  python-version:
    description: Versão do Python
    required: true
    default: '3.12'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: Atoms/requirements.lock
    - name: Instalar dependências
      shell: bash
      working-directory: Atoms
      run: |
        python -m pip install --upgrade pip==26.1.2
        python -m pip install --only-binary=:all: --require-hashes --requirement requirements.lock
