# .pre-commit-config.yaml — Neutron Star
#
# Roda automaticamente antes de cada commit (hooks rápidos) e antes de cada
# push (hooks lentos, como mypy). Para pular uma vez: `git commit --no-verify`.
#
# Para instalar:   pre-commit install && pre-commit install --hook-type pre-push
# Para rodar tudo: pre-commit run --all-files
# Para atualizar:  pre-commit autoupdate

default_language_version:
  python: python3.12

# =============================================================================
# Hooks rápidos — rodam a cada commit
# =============================================================================
repos:
  # --------------------------------------------------------------------------
  # 1. Higiene, segurança e validação de arquivos
  # --------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: Remover espaços em branco no final das linhas
        exclude: \.md$
      - id: end-of-file-fixer
        name: Garantir nova linha no final de cada arquivo
      - id: check-yaml
        name: Validar sintaxe de arquivos YAML
      - id: check-toml
        name: Validar sintaxe do pyproject.toml
      - id: check-json
        name: Validar sintaxe de arquivos JSON
      - id: check-added-large-files
        name: Bloquear arquivos acima de 500 KB
        args: ['--maxkb=500']
      - id: check-merge-conflict
        name: Detectar marcadores de conflito de merge esquecidos
      - id: check-case-conflict
        name: Detectar colisões de maiúsculas/minúsculas (Windows/macOS)
      - id: mixed-line-ending
        name: Normalizar quebras de linha (LF)
        args: ['--fix=lf']
      - id: check-ast
        name: Validar sintaxe de arquivos Python (sem executar)
        files: ^Atoms/.*\.py$
      - id: debug-statements
        name: Bloquear commits com breakpoint() ou pdb
        files: ^Atoms/.*\.py$
      - id: detect-private-key
        name: Bloquear vazamento acidental de chaves privadas

  # --------------------------------------------------------------------------
  # 2. Ruff — linter + formatador Python
  # --------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        name: Ruff (linter com auto-fix)
        args: [ --fix, --exit-non-zero-on-fix ]
        files: ^Atoms/.*\.py$
      - id: ruff-format
        name: Ruff (formatação PEP 8)
        files: ^Atoms/.*\.py$

# =============================================================================
# Hooks lentos — rodam apenas no pre-push
# =============================================================================
  # --------------------------------------------------------------------------
  # 3. Mypy — checagem estática de tipos (pre-push)
  # --------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: mypy
        name: Checagem de tipos com Mypy
        entry: bash -c 'cd Atoms && PYTHONPATH=src:. ../.venv/bin/python -m mypy src'
        language: system
        pass_filenames: false
        files: ^Atoms/.*\.py$
        stages: [pre-push]
