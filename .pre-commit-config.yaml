default_language_version:
  python: python3.12

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd Atoms && PYTHONPATH=src python -m ruff check --fix src tests main.py'
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd Atoms && PYTHONPATH=src python -m ruff format src tests main.py'
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: bash -c 'cd Atoms && PYTHONPATH=src python -m pytest tests -q'
        language: system
        pass_filenames: false
