# =============================================================================
# sonar-project.properties — Configuração do SonarQube / SonarCloud
# =============================================================================
#
# Como usar:
#   1. SonarCloud (recomendado):
#      → Importe o repositório no https://sonarcloud.io
#      → Configure SONAR_TOKEN como secret no GitHub
#   2. SonarQube local:
#      → docker run -p 9000:9000 sonarqube:community
#      → sonar-scanner -Dsonar.host.url=http://localhost:9000
# =============================================================================

# ---------------------------------------------------------------------------
# Identificação do projeto
# ---------------------------------------------------------------------------
sonar.projectKey=DiasPedroQA_Neutron_Star
sonar.organization=skynet-app
sonar.projectName=Neutron Star
sonar.projectVersion=0.1.0

# ---------------------------------------------------------------------------
# Código-fonte e testes (dentro da pasta Atoms)
# ---------------------------------------------------------------------------
sonar.sources=Atoms/src
sonar.tests=Atoms/tests
sonar.test.inclusions=Atoms/tests/test_*.py

# Exclusões
sonar.exclusions=\
  Atoms/.venv/**,\
  Atoms/**/__pycache__/**,\
  Atoms/**/htmlcov/**,\
  Atoms/**/dist/**,\
  Atoms/**/build/**,\
  Atoms/docs/_build/**

# ---------------------------------------------------------------------------
# Cobertura
# ---------------------------------------------------------------------------
sonar.python.coverage.reportPaths=Atoms/coverage.xml
sonar.python.version=3.10, 3.12

# ---------------------------------------------------------------------------
# Encoding
# ---------------------------------------------------------------------------
sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------
# Supressão de alertas específicos
# ---------------------------------------------------------------------------
# e1: S7637 em ci-cd.yml (motivo original já registrado no projeto)
# e2: S8544 em static.yml (workflow não coberto por lock de dependências)
# e3: S8544 em docs.yml   (workflow não coberto por lock de dependências)
# e4: S8544 em ci-cd.yml — RISCO ACEITO CONSCIENTEMENTE.
#     Histórico: o projeto tentou hash-locking (requirements.lock +
#     --require-hashes, depois split em requirements.lock/-ci/-docs) por
#     várias iterações. A manutenção quebrou repetidamente em CI: pip-tools
#     incompatível com o pip dos runners, uv com resolução divergente da
#     local, e desalinhamento entre qual job lia qual lock file — mais
#     fricção operacional do que ganho de segurança real no estágio atual
#     do projeto.
#     Mitigação que SUBSTITUI o hash-lock: o job "security" roda pip-audit
#     contra o ambiente instalado a cada execução — CVEs conhecidas ainda
#     são pegas, só não há mais garantia de hash-pinning bit-a-bit.
#     Reavaliar se o projeto crescer em superfície de dependências ou
#     ganhar mais colaboradores externos.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/ci-cd.yml
sonar.issue.ignore.multicriteria.e2.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.e2.resourceKey=.github/workflows/static.yml
sonar.issue.ignore.multicriteria.e3.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.e3.resourceKey=.github/workflows/docs.yml
sonar.issue.ignore.multicriteria.e4.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.e4.resourceKey=.github/workflows/ci-cd.yml
