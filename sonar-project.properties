# =============================================================================
# sonar-project.properties — Configuração do SonarQube / SonarCloud
# =============================================================================
#
# Como usar:
#   1. SonarCloud (recomendado):
#      → Importe o repositório no https://sonarcloud.io
#      → Configure SONAR_TOKEN como secret no GitHub
#   2. SonarQube local:
#      → docker run -p 9000:9000 sonarqube:community
#      → sonar-scanner -Dsonar.host.url=http://localhost:9000
# =============================================================================

# ---------------------------------------------------------------------------
# Identificação do projeto
# ---------------------------------------------------------------------------
sonar.projectKey=DiasPedroQA_Neutron_Star
sonar.organization=skynet-app
sonar.projectName=Neutron Star
sonar.projectVersion=0.1.0

# ---------------------------------------------------------------------------
# Código-fonte e testes (dentro da pasta Atoms)
# ---------------------------------------------------------------------------
sonar.sources=Atoms/src
sonar.tests=Atoms/tests
sonar.test.inclusions=Atoms/tests/test_*.py

# Exclusões
sonar.exclusions=\
  Atoms/.venv/**,\
  Atoms/**/__pycache__/**,\
  Atoms/**/htmlcov/**,\
  Atoms/**/dist/**,\
  Atoms/**/build/**,\
  docs/_build/**

# ---------------------------------------------------------------------------
# Cobertura
# ---------------------------------------------------------------------------
sonar.python.coverage.reportPaths=Atoms/coverage.xml
sonar.python.version=3.10, 3.12

# ---------------------------------------------------------------------------
# Encoding
# ---------------------------------------------------------------------------
sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------
# Supressão de alertas específicos (exemplo)
# ---------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/static.yml
