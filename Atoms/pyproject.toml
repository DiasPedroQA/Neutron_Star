# ============================================================
# Build system
# ============================================================
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ============================================================
# Metadados do projeto
# ============================================================
[project]
name = "neutron-star"
version = "0.1.0"
description = "API para extrair tags de bookmarks HTML"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0.1",
    "beautifulsoup4>=4.12.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pylint>=3.3.0",
    "pytest-playwright>=0.5.0",
]

# ============================================================
# Empacotamento (setuptools)
# ============================================================
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "dominio*",
    "aplicacao*",
    "infra*",
    "adaptadores*",
    "utils*",
    "templates*",
    "static*",
]

[tool.setuptools.package-data]
"*" = ["**/*.html", "**/*.css", "**/*.js", "**/*.woff", "**/*.woff2", "**/*.json"]

# ============================================================
# Pytest
# ============================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "e2e: Testes de ponta a ponta (End-to-End) usando Playwright",
    "integration: Testes de integração de API e banco/infra",
]

# ============================================================
# Cobertura
# ============================================================
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# ============================================================
# MyPy
# ============================================================
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
explicit_package_bases = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["flask.*", "werkzeug.*", "bs4.*"]
ignore_missing_imports = true

# ============================================================
# Ruff
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PL"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]  # S101 = allow assert, PLR2004 = allow magic numbers in tests

[tool.pylint.messages_control]
disable = [
    "too-few-public-methods",
    "redefined-outer-name",
    "missing-function-docstring",
    "protected-access",
    "abstract-class-instantiated",
]
