# pyproject.toml
[pipeline]
etapas = ["busca", "extrair", "exportar"]  # quais etapas rodar

[parametros]
dirs = ["~", "./dados"]
extensao = ".html"
chaves = ["bookmarks"]
exigir_data = false
indice_arquivo = 0
formatos_exportacao = [".json", ".csv"]
diretorio_saida = "resultados"


[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neutron-star"
version = "0.1.0"
description = "Ferramenta CLI de busca em sistema de arquivos com filtros avançados."
authors = [{ name = "Pedro Dias", email = "diaspedro.dev@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "rich>=13.7.0",
    "lxml>=5.0.0",
    "python-dateutil>=2.9.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: System :: Filesystems",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
]
urls = { homepage = "https://github.com/diaspedro/neutron-star", repository = "https://github.com/diaspedro/neutron-star.git", issues = "https://github.com/diaspedro/neutron-star/issues" }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "pyfakefs>=5.4.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.0",
    "sphinx>=7.2.0",
    "furo>=2024.1.29",
    "types-requests",
    "types-setuptools",
    "types-python-dateutil",
]

[project.scripts]
neutron = "src.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["Atoms/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=Atoms/src",
    "--cov-report=term-missing",
    "--cov-report=html:coverage_html",
    # removido "-n=auto" para evitar conflitos com pyfakefs; ative explicitamente se necessário
]
markers = [
    "slow: marca testes lentos (ex: que acessam disco ou rede).",
    "integration: marca testes de integração.",
    "unit: marca testes unitários puros.",
]

[tool.coverage.run]
source = ["Atoms/src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == \"__main__\":",
    "raise NotImplementedError",
    "except ImportError:",
    "if TYPE_CHECKING:",
]
show_missing = true
fail_under = 85

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["Atoms"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "PL",
    "RET",
    "RUF",
]
ignore = [
    "E501",
    "B008",
    "PLR0913",
    "PLR2004",
    "RUF012",
]
per-file-ignores = { "Atoms/tests/*" = ["PLR", "B", "SIM"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["Atoms"]
exclude = ["Atoms/tests/*"]

[tool.bandit]
exclude_dirs = ["Atoms/tests"]
skips = ["B101"]
severity = "high"
