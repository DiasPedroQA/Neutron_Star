[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neutron-star"
version = "0.1.0"
description = "API para extrair tags de bookmarks HTML"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0.1",
    "beautifulsoup4>=4.12.3",
]

[project.optional-dependencies]
dev = [
    "pylint>=3.2,<4",
    "ruff",
    "mypy>=1.10",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["src*"]

[tool.pylint.messages_control]
disable = [
    "C0411",  # wrong-import-order
    "C0412",  # ungrouped-imports
    "C0413",  # wrong-import-position
    "C0103",  # invalid-name
    "R0801",  # duplicate-code
    "E0015",  # unrecognized-option
    "C0301",  # line-too-long
    "W0212",  # protected-access
    "W0703",  # broad-except
    "W0621",  # redefined-outer-name
]

[tool.pylint.main]
py-version = "3.12"
ignore = ["venv", ".venv", "docs"]
persistent = true
score = false

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
explicit_package_bases = true
disable_error_code = ["import-untyped"]

[tool.pylint.format]
max-line-length = 100
indent-string = "    "

[tool.pylint.typecheck]
ignored-classes = ["optparse.Values", "thread._local", "_thread._local"]

[tool.pylint.variables]
dummy-variables-rgx = "_$|dummy|_|tokens"

[tool.pylint.imports]
allow-any-import-level = "module"

[tool.pylint.design]
max-args = 7
max-locals = 15
min-public-methods = 0

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
ignore = ["I001"]
