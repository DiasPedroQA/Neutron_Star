# ============================================================
# Build system
# ============================================================
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ============================================================
# Metadados do projeto
# ============================================================
[project]
name = "neutron-star"
version = "0.1.0"
description = "Processamento e conversão inteligente de bookmarks HTML Netscape (MVC)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0.1",
    "beautifulsoup4>=4.12.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pylint>=3.3.0",
    "pytest-playwright>=0.5.0",
]

[project.scripts]
neutron-star = "src.controllers.cli_controller:CLIController.main"

# ============================================================
# Pytest
# ============================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py", "characterization_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-ra",
    "-v",
]
markers = [
    "e2e: Testes de ponta a ponta (End-to-End) usando Playwright",
    "integration: Testes de integração de API e Web",
    "models: Testes unitários dos models e lógica de negócio",
    "controllers: Testes dos controladores REST, SSE e CLI",
    "characterization: Testes de caracterização de comportamentos existentes",
]

# ============================================================
# Cobertura de Código
# ============================================================
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 50  # CATRACA: só sobe. Meta: 80% (linha) + branch. Ver Sprint 1.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# ============================================================
# MyPy (Checagem Estática de Tipos)
# ============================================================
[tool.mypy]
mypy_path = "."
explicit_package_bases = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["flask.*", "werkzeug.*", "bs4.*"]
ignore_missing_imports = true

# ============================================================
# Ruff (Linter & Formatter)
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PL"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # números mágicos permitidos em asserções

# ============================================================
# Pylint
# ============================================================
[tool.pylint.main]
source-roots = ["."]

[tool.pylint.messages_control]
disable = [
    "too-few-public-methods",
    "redefined-outer-name",
    "missing-function-docstring",
    "protected-access",
    "abstract-class-instantiated",
    "duplicate-code",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
