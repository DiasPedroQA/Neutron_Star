[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neutron-star-atoms"
version = "0.1.0"
description = "API de arquivos html - Neutron Star"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "anyio>=4.4,<4.9",
    "fastapi>=0.110,<0.116",
    "pydantic>=2.7,<2.11",
    "uvicorn>=0.29,<0.31",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pylint>=3.2,<4",
    "ruff",
    "httpx>=0.27,<0.29",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pylint.messages_control]
disable = [
    #"C0114",  # missing-module-docstring
    #"C0115",  # missing-class-docstring
]
