[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Neutron-Star"
version = "0.1.0"
description = "Descobre, lê e converte arquivos de bookmarks (Netscape) via CLI ou API."
readme = "README.md"
authors = [{name = "DiasPedroQA", email = "pedro@example.com"}]
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["bookmarks", "netscape", "html", "converter", "cli", "api"]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "html5lib>=1.1",
    "numpy>=1.23,<2.3",
    "pandas>=2.0,<2.3.3",
    "lxml>=5.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
]
docs = [
    "sphinx>=8.0.2,<9",
    "furo>=2024.8.6",
]
security = [
    "bandit>=1.7.5,<2",
    "pip-audit>=2.6.1,<3",
    "pbr>=5.11.1,<6",
]
build = ["build>=1.2,<2"]
lock = ["pip-tools>=7.6,<8"]
excel = ["openpyxl>=3.1"]
parquet = ["pyarrow>=14.0"]
table = ["tabulate>=0.9"]

[project.urls]
Homepage = "https://github.com/DiasPedroQA/Neutron_Star"
Repository = "https://github.com/DiasPedroQA/Neutron_Star.git"
Issues = "https://github.com/DiasPedroQA/Neutron_Star/issues"

[project.scripts]
bookmarks-cli = "src.adaptadores.cli:main"
bookmarks-api = "src.adaptadores.api:main"

[tool.setuptools]
packages = {find = {where = ["src"]}}

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "B", "C", "UP"]
ignore = ["E501"]

[tool.bandit]
exclude_dirs = ["tests", "docs", ".venv", ".github"]
skips = ["B101"]   # se usar asserts em testes
