[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Neutron-Star"
version = "0.1.0"
description = "Descobre, lê e converte arquivos de bookmarks (Netscape) via CLI ou API."
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "html5lib>=1.1",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
    "lxml>=5.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
bookmarks-cli = "src.adaptadores.cli:main"
bookmarks-api = "src.adaptadores.api:main"

[tool.setuptools]
packages = [
    "src",
    "src.dominio",
    "src.aplicacao",
    "src.aplicacao.casos_de_uso",
    "src.adaptadores",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.bandit]
# Configuração básica para o Bandit
exclude_dirs = ["tests", "docs"]
