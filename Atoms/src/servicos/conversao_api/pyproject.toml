[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conversao-api"
version = "0.1.0"
description = "Microsserviço: converte listas de bookmarks para csv/json/parquet/xml/md."
requires-python = ">=3.12"
dependencies = [
    "neutron-dominio",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pandas>=2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/conversao_api"]

# Instalar antes (monorepo local):
#   pip install -e ../../pacotes/neutron_dominio
#   pip install -e .
