[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orquestrador-api"
version = "0.1.0"
description = "Microsserviço: orquestra busca-api + conversao-api via HTTP em uma única chamada."
requires-python = ">=3.12"
dependencies = [
    "neutron-dominio",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orquestrador_api"]

# Instalar antes (monorepo local):
#   pip install -e ../../pacotes/neutron_dominio
#   pip install -e .
#
# Endereços dos outros serviços via variáveis de ambiente:
#   BUSCA_API_URL (padrão: http://localhost:8001)
#   CONVERSAO_API_URL (padrão: http://localhost:8002)
